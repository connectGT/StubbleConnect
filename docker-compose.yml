services:
  db:
    image: postgis/postgis:15-3.3
    environment:
      POSTGRES_USER: stubble_user
      POSTGRES_PASSWORD: stubble_password
      POSTGRES_DB: stubble_db
    ports:
      - "5432:5432"
    volumes:
      - postgis_data:/var/lib/postgresql/data

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:8000/api/v1
    depends_on:
      - backend

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - DATABASE_URL=postgresql://stubble_user:stubble_password@db:5432/stubble_db
    depends_on:
      - db

volumes:
  postgis_data:
